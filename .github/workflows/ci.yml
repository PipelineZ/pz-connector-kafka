name: ci

on:
  push:
    branches: [main]
  pull_request: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build Pz.Connector.Kafka.slnx -c Release
      # ubuntu has docker, so the Testcontainers broker facts run; windows cannot pull Linux images,
      # so it runs everything that is not broker-backed.
      - if: runner.os == 'Linux'
        run: dotnet test Pz.Connector.Kafka.slnx -c Release --no-build --blame-hang --blame-hang-timeout 10m --blame-hang-dump-type mini
      - if: runner.os == 'Windows'
        run: dotnet test Pz.Connector.Kafka.slnx -c Release --no-build --filter "Category!=Docker" --blame-hang --blame-hang-timeout 10m --blame-hang-dump-type mini

  pack-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Publish the host RID and pack
        run: |
          set -euo pipefail
          # A separate `restore -r` before `publish -r --no-restore` is required on a cold NuGet
          # cache: the restore folded into `publish -r` alone does not pull the RID-specific
          # Microsoft.NETCore.App.Runtime/Microsoft.AspNetCore.App.Runtime packs this self-contained
          # build's FrameworkReference needs (NETSDK1112), even though the same restore run standalone
          # does.
          dotnet restore src/Pz.Connector.Kafka -r linux-x64
          dotnet publish src/Pz.Connector.Kafka -c Release -r linux-x64 --no-restore
          dotnet pack src/Pz.Connector.Kafka -c Release -o packages
          ls packages
          VERSION="$(ls packages/Pz.Connector.Kafka.*.nupkg | sed -E 's|.*/Pz\.Connector\.Kafka\.(.*)\.nupkg|\1|')"
          echo "PKG_VERSION=${VERSION}" >> "$GITHUB_ENV"
          unzip -p "packages/Pz.Connector.Kafka.${VERSION}.nupkg" pz.connector.json | tee manifest.json
          grep -q '"runtime": "process"' manifest.json
          grep -q '"name": "kafka"' manifest.json
          grep -q '"projectDirectoryAnchor": true' manifest.json
          grep -q '"SyncState"' manifest.json
      - name: Start a broker
        run: |
          set -euo pipefail
          docker run -d --name kafka -p 9092:9092 apache/kafka:3.9.1
          for i in $(seq 1 60); do
            docker exec kafka /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1 && break
            sleep 1
          done
          docker exec kafka /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --create --topic e2e-in --partitions 2
          docker exec kafka /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --create --topic e2e-out --partitions 1
          docker exec kafka /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --create --topic e2e-probe --partitions 1
          printf '{"name":"ann"}\n{"name":"bob"}\n{"name":"cy"}\n' \
            | docker exec -i kafka /opt/kafka/bin/kafka-console-producer.sh --bootstrap-server localhost:9092 --topic e2e-in
      - name: Install pz, restore from the local feed, run, conformance-test
        env:
          KAFKA_BOOTSTRAP: localhost:9092
        run: |
          set -euo pipefail
          dotnet tool install --global pz --version 0.5.1
          cd tests/e2e
          sed -i "s/0.0.0-PLACEHOLDER/${PKG_VERSION}/" project.yml
          pz restore --feeds "${GITHUB_WORKSPACE}/packages"
          PKG_DIR=".pz/packages/Pz.Connector.Kafka/${PKG_VERSION}"
          test -f "${PKG_DIR}/native/Pz.Connector.Kafka"
          pz run
          # Three rows in, three records out.
          docker exec kafka /opt/kafka/bin/kafka-console-consumer.sh --bootstrap-server localhost:9092 \
            --topic e2e-out --from-beginning --max-messages 3 --timeout-ms 30000 --property print.key=true | tee out.txt
          test "$(wc -l < out.txt)" -eq 3
          grep -q '"name":"bob"' out.txt
          # A second run lands nothing new (the token advanced) and stays green.
          pz run
          pz connector test "${PKG_DIR}" --config probe.yml | tee report.txt
          ! grep -q FAIL report.txt
          grep -q 'sync-state-roundtrip' report.txt
